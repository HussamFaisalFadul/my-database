<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; text-align: center; background: #f7f7f7; }
    img {
      max-width: 90%;
      margin: 20px auto;
      display: none;
      border-radius: 12px;
      box-shadow: 0 0 10px #aaa;
    }
    img:first-of-type {
      display: block;
    }
  </style>
</head>
<body>

  <img id="image1" src="images/photo_5868304999140494348_y.jpg" alt="تحميل التطبيق" onclick="openStore()">
  <img id="image2" src="images/2.png" alt="صورة 2" onclick="openStore()">
  <img id="image3" src="images/photo_5868304999140494348_y.jpg" alt="صورة 3" onclick="openStore()">

  <script>
    function openStore() {
      // محاولة فتح تطبيق Google Play مباشرة
      window.location.href = "market://details?id=com.hussam.azkar";
      
      // إذا فشل، يفتح الموقع بعد ثانية
      setTimeout(function() {
        window.location.href = "https://play.google.com/store/apps/details?id=com.hussam.azkar";
      }, 1000);
    }

    // الحصول على جميع الصور
    const images = document.querySelectorAll('img');
    let currentIndex = 0;

    function showNextImage() {
      images[currentIndex].style.display = 'none';
      currentIndex = (currentIndex + 1) % images.length;
      images[currentIndex].style.display = 'block';
    }

    setInterval(showNextImage, 5000);
  </script>

</body>
</html>
