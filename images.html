<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; text-align: center; background: #f7f7f7; }
    img {
      max-width: 90%;
      margin: 20px auto;
      display: none;
      border-radius: 12px;
      box-shadow: 0 0 10px #aaa;
    }
    img:first-of-type {
      display: block;
    }
    .store-btn {
      display: inline-block;
      margin: 10px auto;
      padding: 12px 30px;
      background: #01875f;
      color: white;
      text-decoration: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <img id="image1" src="images/photo_5868304999140494348_y.jpg" alt="تحميل التطبيق">
  <img id="image2" src="images/photo_5868304999140494397_y.jpg" alt="صورة 2">
  <img id="image3" src="images/photo_5868304999140494348_y.jpg" alt="صورة 3">

  <!-- زر التحميل -->
  <br>
  <a class="store-btn" 
     href="https://play.google.com/store/apps/details?id=com.hussam.azkar"
     target="_blank">
    ⬇️ حمّل التطبيق من Google Play
  </a>

  <script>
    const images = document.querySelectorAll('img');
    let currentIndex = 0;

    function showNextImage() {
      images[currentIndex].style.display = 'none';
      currentIndex = (currentIndex + 1) % images.length;
      images[currentIndex].style.display = 'block';
    }

    setInterval(showNextImage, 5000);
  </script>

</body>
</html>
