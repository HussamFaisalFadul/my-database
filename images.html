<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    body { 
      font-family: sans-serif; 
      text-align: center; 
      background: #f7f7f7; 
    }
    img {
      width: 100px;       /* عرض ثابت */
      height: 100px;      /* ارتفاع ثابت */
      object-fit: cover;  /* قص الصورة لتناسب الحجم */
      margin: 20px auto;
      display: none; 
      border-radius: 12px;
      box-shadow: 0 0 10px #aaa;
    }
    img:first-of-type {
      display: block;
    }
  </style>
</head>
<body>
  <img id="image1" src="images/1.jpg" alt="صورة 1">
  <img id="image2" src="images/2.jpg" alt="صورة 2">
  <img id="image3" src="images/3.jpg" alt="صورة 2">

  <script>
    const images = document.querySelectorAll('img');
    let currentIndex = 0;

    function showNextImage() {
      images[currentIndex].style.display = 'none';
      currentIndex = (currentIndex + 1) % images.length;
      images[currentIndex].style.display = 'block';
    }

    setInterval(showNextImage, 5000);
  </script>
</body>
</html>
